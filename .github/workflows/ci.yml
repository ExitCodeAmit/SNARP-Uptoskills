name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js
      - name: Test backend helpers and migrations
        working-directory: backend
        run: npm test
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend helpers
        working-directory: frontend
        run: npm test
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: snarp
          POSTGRES_USER: snarp
          POSTGRES_PASSWORD: snarp-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snarp -d snarp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://snarp:snarp-ci-password@localhost:5432/snarp
      JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
      REQUIRE_EMAIL_VERIFICATION: "false"
      PORT: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build
        run: npm run build
      - name: Start server
        run: |
          node backend/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:5000/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Smoke test
        run: SMOKE_EXPECT_FRONTEND=true npm run smoke
      - name: Server log
        if: always()
        run: cat server.log

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t snarp:ci .
